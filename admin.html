<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة تحكم Pop Pro</title><link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header"><div><span class="eyebrow">POP PRO / CONTROL CENTER</span><h1>لوحة التحكم</h1><p>عدّل بيانات الموقع وارفع صورك من جهازك مباشرة.</p></div><a class="preview" href="/" target="_blank">معاينة الموقع ↗</a></header>
    <section class="panel"><div class="panel-title"><div><span class="eyebrow">CONTENT</span><h2>بيانات الواجهة</h2></div><span id="status" class="status">جاهز</span></div>
      <form id="settingsForm" class="form-grid"><label>اسم الموقع<input id="siteName" required></label><label>العنوان الرئيسي<input id="tagline" required></label><label class="wide">الوصف المختصر<textarea id="description" rows="3"></textarea></label><label>رقم الواتساب<input id="phone" inputmode="numeric" placeholder="9665xxxxxxxx"></label><div class="wide actions"><button type="submit">حفظ التعديلات</button><a href="/" target="_blank" class="ghost">فتح الموقع</a></div></form>
    </section>
    <section class="panel"><div class="panel-title"><div><span class="eyebrow">MEDIA LIBRARY</span><h2>معرض الصور</h2></div><label class="upload"><input id="imageInput" type="file" accept="image/*" multiple>+ إضافة صور</label></div><p class="hint">اختر صورة أو أكثر. سيتم حفظها داخل <code>image/uploads</code> وإضافتها تلقائيًا للمعرض المحلي.</p><div id="gallery" class="gallery"></div></section>
  </main><script src="admin.js"></script>
</body></html>
